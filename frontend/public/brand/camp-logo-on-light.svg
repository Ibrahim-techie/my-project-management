  <path d="M432.35 136.1 A10 10 0 0 0 433.52 121.68 A223 223 0 1 0 460.42 380.98 A10 10 0 0 0 451.75 366 H377.46 A4 4 0 0 0 374.49 367.32 A145 145 0 1 1 375.97 174.34 A6 6 0 0 0 384.26 175.05 Z" fill="url(#cl-c)"/>
