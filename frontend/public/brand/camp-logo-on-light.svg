    <rect x="260.5" y="265" width="50" height="18" rx="9" fill="#fff" fill-opacity="0.6"/>
    <rect x="260.5" y="298" width="50" height="18" rx="9" fill="#fff" fill-opacity="0.45"/>
    <rect x="345.5" y="232" width="50" height="18" rx="9" fill="#fff" fill-opacity="0.78"/>
    <rect x="345.5" y="265" width="50" height="18" rx="9" fill="#fff" fill-opacity="0.6"/>
